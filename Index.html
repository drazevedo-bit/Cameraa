<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Câmera do Celular</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f12;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: #e8e8e8;
  }
  .video-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 3 / 4;
    background: #1a1a1e;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  video, canvas, img.preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .rec-dot {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ff3b30;
    display: none;
    animation: pulse 1s infinite;
  }
  .rec-dot.active { display: block; }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin-top: 20px;
    width: 100%;
    max-width: 480px;
  }
  button {
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
  }
  button:active { transform: scale(0.92); }
  #shotBtn {
    width: 72px;
    height: 72px;
    background: #fff;
    border: 4px solid #444;
  }
  #shotBtn.recording {
    background: #ff3b30;
    border-color: #7a0000;
  }
  #switchBtn, #modeToggle {
    width: 48px;
    height: 48px;
    background: #26262b;
    color: #f2f2f2;
    font-size: 20px;
  }
  .mode-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    background: #1a1a1e;
    border-radius: 20px;
    padding: 4px;
  }
  .mode-row button {
    border-radius: 16px;
    width: auto;
    padding: 8px 18px;
    font-size: 14px;
    background: transparent;
    color: #999;
  }
  .mode-row button.active {
    background: #f2f2f2;
    color: #0f0f12;
    font-weight: 600;
  }
  .result-actions {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    width: 100%;
    max-width: 480px;
  }
  .result-actions button {
    flex: 1;
    width: auto;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    background: #26262b;
    color: #f2f2f2;
  }
  .result-actions button.primary {
    background: #0a84ff;
  }
  #status {
    margin-top: 10px;
    font-size: 13px;
    color: #999;
    text-align: center;
    min-height: 18px;
  }
  video.hidden-video { display: none; }
</style>
</head>
<body>

<h1>📷 Câmera</h1>

<div class="video-wrap" id="videoWrap">
  <video id="video" autoplay playsinline muted></video>
  <img id="preview" class="preview" style="display:none;">
  <div class="rec-dot" id="recDot"></div>
</div>

<div class="mode-row">
  <button id="photoMode" class="active">Foto</button>
  <button id="videoMode">Vídeo</button>
</div>

<div class="controls">
  <button id="switchBtn" title="Trocar câmera">🔄</button>
  <button id="shotBtn" title="Capturar"></button>
  <div style="width:48px;"></div>
</div>

<div class="result-actions" id="resultActions" style="display:none;">
  <button id="retakeBtn">Refazer</button>
  <button id="downloadBtn" class="primary">Baixar</button>
</div>

<div id="status">Toque em permitir para ativar a câmera.</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
const video = document.getElementById('video');
const preview = document.getElementById('preview');
const canvas = document.getElementById('canvas');
const shotBtn = document.getElementById('shotBtn');
const switchBtn = document.getElementById('switchBtn');
const photoMode = document.getElementById('photoMode');
const videoMode = document.getElementById('videoMode');
const resultActions = document.getElementById('resultActions');
const retakeBtn = document.getElementById('retakeBtn');
const downloadBtn = document.getElementById('downloadBtn');
const statusEl = document.getElementById('status');
const recDot = document.getElementById('recDot');

let currentStream = null;
let facingMode = 'environment';
let mode = 'photo';
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;
let capturedBlobUrl = null;
let capturedIsVideo = false;

async function startCamera() {
  stopCamera();
  try {
    const constraints = {
      video: { facingMode: { ideal: facingMode } },
      audio: mode === 'video'
    };
    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = currentStream;
    video.style.display = 'block';
    preview.style.display = 'none';
    statusEl.textContent = 'Câmera ativa.';
  } catch (err) {
    statusEl.textContent = 'Erro ao acessar a câmera: ' + err.message;
  }
}

function stopCamera() {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
    currentStream = null;
  }
}

switchBtn.addEventListener('click', () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  startCamera();
});

photoMode.addEventListener('click', () => {
  mode = 'photo';
  photoMode.classList.add('active');
  videoMode.classList.remove('active');
  startCamera();
});

videoMode.addEventListener('click', () => {
  mode = 'video';
  videoMode.classList.add('active');
  photoMode.classList.remove('active');
  startCamera();
});

shotBtn.addEventListener('click', () => {
  if (mode === 'photo') {
    takePhoto();
  } else {
    toggleRecording();
  }
});

function takePhoto() {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.toBlob(blob => {
    capturedBlobUrl = URL.createObjectURL(blob);
    capturedIsVideo = false;
    showResult();
  }, 'image/jpeg', 0.92);
}

function toggleRecording() {
  if (!isRecording) {
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(currentStream, { mimeType: 'video/webm' });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      capturedBlobUrl = URL.createObjectURL(blob);
      capturedIsVideo = true;
      showResult();
    };
    mediaRecorder.start();
    isRecording = true;
    shotBtn.classList.add('recording');
    recDot.classList.add('active');
    statusEl.textContent = 'Gravando...';
  } else {
    mediaRecorder.stop();
    isRecording = false;
    shotBtn.classList.remove('recording');
    recDot.classList.remove('active');
    statusEl.textContent = 'Gravação finalizada.';
  }
}

function showResult() {
  video.style.display = 'none';
  if (capturedIsVideo) {
    preview.style.display = 'none';
    let vidPreview = document.createElement('video');
    vidPreview.id = 'videoPreview';
    vidPreview.src = capturedBlobUrl;
    vidPreview.controls = true;
    vidPreview.autoplay = true;
    vidPreview.loop = true;
    vidPreview.style.width = '100%';
    vidPreview.style.height = '100%';
    vidPreview.style.objectFit = 'cover';
    document.getElementById('videoWrap').appendChild(vidPreview);
  } else {
    preview.src = capturedBlobUrl;
    preview.style.display = 'block';
  }
  resultActions.style.display = 'flex';
  shotBtn.style.visibility = 'hidden';
  switchBtn.style.visibility = 'hidden';
}

retakeBtn.addEventListener('click', () => {
  const vp = document.getElementById('videoPreview');
  if (vp) vp.remove();
  preview.style.display = 'none';
  video.style.display = 'block';
  resultActions.style.display = 'none';
  shotBtn.style.visibility = 'visible';
  switchBtn.style.visibility = 'visible';
  statusEl.textContent = 'Câmera ativa.';
  startCamera();
});

downloadBtn.addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = capturedBlobUrl;
  a.download = capturedIsVideo ? 'video.webm' : 'foto.jpg';
  a.click();
});

startCamera();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Jornada</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .painel {
      max-width: 600px;
      margin: auto;
      background: #1f2937;
      padding: 20px;
      border-radius: 16px;
    }

    h1 {
      text-align: center;
    }

    .info {
      font-size: 22px;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    #iniciar {
      background: #22c55e;
    }

    #encerrar {
      background: #ef4444;
      color: white;
    }

    #status {
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="painel">

  <h1>Controle de Jornada</h1>

  <div class="info">
    Status:
    <span id="status">Jornada não iniciada</span>
  </div>

  <div class="info">
    Tempo total:
    <span id="tempoTotal">00:00:00</span>
  </div>

  <div class="info">
    Tempo em movimento:
    <span id="tempoMovimento">00:00:00</span>
  </div>

  <div class="info">
    Tempo parado:
    <span id="tempoParado">00:00:00</span>
  </div>

  <div class="info">
    Distância:
    <span id="distancia">0.00</span> km
  </div>

  <div class="info">
    Velocidade:
    <span id="velocidade">0</span> km/h
  </div>

  <button id="iniciar">🟢 Iniciar jornada</button>

  <button id="encerrar">🔴 Encerrar jornada</button>

</div>

<script>

let jornadaAtiva = false;

let inicioJornada = null;

let segundosMovimento = 0;
let segundosParado = 0;

let ultimaLatitude = null;
let ultimaLongitude = null;

let distanciaTotal = 0;

let watchId = null;


// ================================
// CALCULAR DISTÂNCIA ENTRE GPS
// ================================

function calcularDistancia(lat1, lon1, lat2, lon2) {

  const R = 6371;

  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);

  const c = 2 * Math.atan2(
    Math.sqrt(a),
    Math.sqrt(1 - a)
  );

  return R * c;
}


// ================================
// FORMATAR TEMPO
// ================================

function formatarTempo(segundos) {

  const horas = Math.floor(segundos / 3600);

  const minutos =
    Math.floor((segundos % 3600) / 60);

  const seg =
    segundos % 60;

  return (
    String(horas).padStart(2, "0") + ":" +
    String(minutos).padStart(2, "0") + ":" +
    String(seg).padStart(2, "0")
  );
}


// ================================
// INICIAR JORNADA
// ================================

document
.getElementById("iniciar")
.addEventListener("click", iniciarJornada);


function iniciarJornada() {

  if (jornadaAtiva) return;

  jornadaAtiva = true;

  inicioJornada = Date.now();

  segundosMovimento = 0;
  segundosParado = 0;

  distanciaTotal = 0;

  ultimaLatitude = null;
  ultimaLongitude = null;

  document.getElementById("status")
    .textContent = "🟢 Jornada ativa";

  iniciarGPS();
}


// ================================
// GPS
// ================================

function iniciarGPS() {

  if (!navigator.geolocation) {

    alert("GPS não disponível");

    return;
  }

  watchId =
    navigator.geolocation.watchPosition(

      atualizarPosicao,

      function(erro) {

        console.log(
          "Erro no GPS:",
          erro.message
        );

      },

      {
        enableHighAccuracy: true,
        maximumAge: 5000,
        timeout: 10000
      }

    );
}


// ================================
// ATUALIZAR POSIÇÃO
// ================================

function atualizarPosicao(posicao) {

  if (!jornadaAtiva) return;

  const latitude =
    posicao.coords.latitude;

  const longitude =
    posicao.coords.longitude;

  let velocidade =
    posicao.coords.speed;

  if (velocidade === null) {

    velocidade = 0;

  }

  velocidade =
    velocidade * 3.6;

  document
    .getElementById("velocidade")
    .textContent =
    velocidade.toFixed(0);


  // ----------------------------
  // CALCULAR DISTÂNCIA
  // ----------------------------

  if (
    ultimaLatitude !== null &&
    ultimaLongitude !== null
  ) {

    const trecho =
      calcularDistancia(
        ultimaLatitude,
        ultimaLongitude,
        latitude,
        longitude
      );

    // evita pequenos erros do GPS
    if (trecho > 0.005) {

      distanciaTotal += trecho;

    }

  }

  ultimaLatitude = latitude;
  ultimaLongitude = longitude;

  document
    .getElementById("distancia")
    .textContent =
    distanciaTotal.toFixed(2);


  // ----------------------------
  // MOVIMENTO OU PARADO
  // ----------------------------

  if (velocidade > 5) {

    document
      .getElementById("status")
      .textContent =
      "🚗 Em movimento";

  } else {

    document
      .getElementById("status")
      .textContent =
      "⏸️ Parado";

  }

}


// ================================
// CONTADOR
// ================================

setInterval(function() {

  if (!jornadaAtiva) return;

  const agora = Date.now();

  const totalSegundos =
    Math.floor(
      (agora - inicioJornada) / 1000
    );

  document
    .getElementById("tempoTotal")
    .textContent =
    formatarTempo(totalSegundos);


  const velocidade =
    Number(
      document
        .getElementById("velocidade")
        .textContent
    );


  if (velocidade > 5) {

    segundosMovimento++;

  } else {

    segundosParado++;

  }


  document
    .getElementById("tempoMovimento")
    .textContent =
    formatarTempo(
      segundosMovimento
    );


  document
    .getElementById("tempoParado")
    .textContent =
    formatarTempo(
      segundosParado
    );

}, 1000);


// ================================
// ENCERRAR JORNADA
// ================================

document
.getElementById("encerrar")
.addEventListener(
  "click",
  encerrarJornada
);


function encerrarJornada() {

  if (!jornadaAtiva) return;

  jornadaAtiva = false;


  if (watchId !== null) {

    navigator
      .geolocation
      .clearWatch(watchId);

  }


  document
    .getElementById("status")
    .textContent =
    "🔴 Jornada encerrada";


  salvarJornada();

}


// ================================
// SALVAR NO APARELHO
// ================================

function salvarJornada() {

  const dados = {

    data:
      new Date()
      .toLocaleDateString("pt-BR"),

    distancia:
      distanciaTotal.toFixed(2),

    tempoMovimento:
      segundosMovimento,

    tempoParado:
      segundosParado

  };


  let historico =
    JSON.parse(
      localStorage.getItem(
        "historicoJornadas"
      )
    ) || [];


  historico.push(dados);


  localStorage.setItem(
    "historicoJornadas",
    JSON.stringify(historico)
  );


  console.log(
    "Jornada salva:",
    dados
  );

}

</script>

</body>
</html>

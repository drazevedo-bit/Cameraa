<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mídia de Bordo - V2.2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
#app{position:relative;width:100%;height:100%;background:#000}
#tela-anuncio{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;display:block;z-index:10}
#imagem-anuncio{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000}
#fallback-anuncio{position:absolute;top:0;left:0;width:100%;height:100%;display:none;background:#07111f;text-align:center;padding:80px 25px 25px}
#fallback-anuncio h1{font-size:34px;color:#38bdf8;margin-bottom:18px}
#fallback-anuncio p{font-size:20px;line-height:1.4;color:#dbeafe}
.barra-container{position:absolute;left:0;bottom:0;width:100%;height:5px;background:rgba(255,255,255,.15);z-index:30}
#barra-anuncio{width:0%;height:100%;background:#f59e0b;-webkit-transition-property:width;-webkit-transition-timing-function:linear;transition-property:width;transition-timing-function:linear}
#tela-info{position:absolute;top:0;left:0;width:100%;height:100%;display:none;z-index:20;background:#08111f;text-align:center}
.info-centro{position:absolute;top:50%;left:0;width:100%;transform:translateY(-50%);-webkit-transform:translateY(-50%);padding:20px}
#tipo-info{font-size:15px;color:#38bdf8;text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;font-weight:bold}
#titulo-info{font-size:34px;color:#fff;font-weight:bold;margin-bottom:14px}
#relogio{font-size:86px;line-height:1;font-weight:bold;color:#fff;margin-bottom:10px}
#data{font-size:24px;color:#94a3b8;margin-bottom:28px;text-transform:capitalize}
#cidade{font-size:28px;font-weight:bold;color:#38bdf8;margin-bottom:6px}
#clima{font-size:22px;color:#dbeafe;margin-bottom:30px}
#mensagem{font-size:20px;color:#e2e8f0;margin-top:10px;line-height:1.4}
#proximo{margin-top:24px;font-size:15px;color:#64748b;text-transform:uppercase;letter-spacing:1px}
#barra-info{position:absolute;bottom:0;left:0;width:0%;height:5px;background:#38bdf8;-webkit-transition-property:width;-webkit-transition-timing-function:linear;transition-property:width;transition-timing-function:linear}
@media (orientation:landscape){
#relogio{font-size:72px}
#data{font-size:20px;margin-bottom:20px}
#cidade{font-size:24px}
#clima{font-size:18px;margin-bottom:18px}
#tipo-info{font-size:12px;margin-bottom:10px}
#titulo-info{font-size:28px;margin-bottom:10px}
#mensagem{font-size:17px}
#proximo{margin-top:16px;font-size:13px}
}
</style>
</head>
<body>
<div id="app">
  <div id="tela-anuncio">
    <img id="imagem-anuncio" src="" alt="Anúncio">
    <div id="fallback-anuncio">
      <h1 id="fallback-titulo">ANÚNCIO</h1>
      <p id="fallback-texto">Mídia não encontrada.</p>
    </div>
    <div class="barra-container"><div id="barra-anuncio"></div></div>
  </div>

  <div id="tela-info">
    <div class="info-centro">
      <div id="tipo-info">Mídia de Bordo</div>
      <div id="titulo-info">Boa viagem!</div>

      <div id="bloco-relogio">
        <div id="relogio">00:00</div>
        <div id="data">Carregando...</div>
      </div>

      <div id="bloco-clima">
        <div id="cidade">Caraguatatuba</div>
        <div id="clima">--°C • Consultando clima...</div>
      </div>

      <div id="mensagem">Tenha uma ótima viagem!</div>
      <div id="proximo">Próximo anúncio em instantes</div>
    </div>

    <div id="barra-info"></div>
  </div>
</div>

<script type="text/javascript">
var DURACAO_ANUNCIO=15000;
var DURACAO_INFO=6000;

var CAMPANHAS=[
  {titulo:"Anúncio de Teste",imagem:"img/anuncio01.png"},
  {titulo:"Anunciante 02",imagem:"img/anuncio02.jpg"},
  {titulo:"Anunciante 03",imagem:"img/anuncio03.jpg"},
  {titulo:"Anunciante 04",imagem:"img/anuncio04.jpg"}
];

var INTERVALOS=[
  {
    tipo:"Hora e clima",
    titulo:"Como está sua viagem?",
    mensagem:"Veja a hora e o clima antes do próximo anúncio.",
    mostrarRelogio:true,
    mostrarClima:true
  },
  {
    tipo:"Segurança",
    titulo:"Cinto também no banco traseiro",
    mensagem:"Mesmo em trajetos curtos, todos os passageiros devem usar o cinto de segurança.",
    mostrarRelogio:false,
    mostrarClima:false
  },
  {
    tipo:"Boa viagem",
    titulo:"Aproveite o caminho",
    mensagem:"Relaxe, curta a viagem e tenha um excelente destino.",
    mostrarRelogio:true,
    mostrarClima:false
  },
  {
    tipo:"Curiosidade local",
    titulo:"Você está no Litoral Norte",
    mensagem:"Caraguatatuba é uma das principais cidades do Litoral Norte de São Paulo.",
    mostrarRelogio:false,
    mostrarClima:true
  },
  {
    tipo:"Mídia de Bordo",
    titulo:"Sua empresa pode aparecer aqui",
    mensagem:"Anúncios em tela cheia para passageiros durante a viagem.",
    mostrarRelogio:false,
    mostrarClima:false
  },
  {
    tipo:"Segurança",
    titulo:"Desembarque com atenção",
    mensagem:"Antes de abrir a porta, observe bicicletas, motos e outros veículos.",
    mostrarRelogio:false,
    mostrarClima:false
  },
  {
    tipo:"Conforto",
    titulo:"Precisa ajustar algo?",
    mensagem:"Se precisar alterar o ar, o som ou fazer uma parada, converse com o motorista.",
    mostrarRelogio:false,
    mostrarClima:false
  }
];

var indiceAtual=0;
var ultimoIntervalo=-1;
var timerPrincipal=null;
var preloader=null;

window.onload=function(){
  iniciarRelogio();
  buscarClima();
  mostrarAnuncio(indiceAtual);
  setInterval(function(){buscarClima();},1200000);
};

function mostrarAnuncio(indice){
  if(timerPrincipal){clearTimeout(timerPrincipal);}
  if(indice>=CAMPANHAS.length){indice=0;}
  indiceAtual=indice;

  var telaAnuncio=document.getElementById("tela-anuncio");
  var telaInfo=document.getElementById("tela-info");
  var img=document.getElementById("imagem-anuncio");
  var fallback=document.getElementById("fallback-anuncio");
  var campanha=CAMPANHAS[indiceAtual];
  var caminho=campanha.imagem+"?v=22";

  /* V2.2: nunca exibe a imagem anterior durante a troca. */
  img.style.display="none";
  fallback.style.display="none";

  document.getElementById("fallback-titulo").innerHTML=campanha.titulo;
  document.getElementById("fallback-texto").innerHTML="Arquivo esperado: "+campanha.imagem;

  img.onerror=function(){
    img.style.display="none";
    fallback.style.display="block";
    telaInfo.style.display="none";
    telaAnuncio.style.display="block";
  };

  img.onload=function(){
    fallback.style.display="none";
    telaInfo.style.display="none";
    telaAnuncio.style.display="block";
    img.style.display="block";
  };

  /* A nova arte é aplicada enquanto ainda está escondida. */
  img.src=caminho;

  /* Se a imagem já veio do cache/pré-carregamento, o onload entra imediatamente. */
  animarBarra("barra-anuncio",DURACAO_ANUNCIO);

  timerPrincipal=setTimeout(function(){
    mostrarInfo();
  },DURACAO_ANUNCIO);
}

function mostrarInfo(){
  if(timerPrincipal){clearTimeout(timerPrincipal);}

  var telaAnuncio=document.getElementById("tela-anuncio");
  var telaInfo=document.getElementById("tela-info");
  var img=document.getElementById("imagem-anuncio");

  /* Primeiro escondemos totalmente o anúncio atual. */
  img.style.display="none";
  telaAnuncio.style.display="none";
  telaInfo.style.display="block";

  var indiceIntervalo=escolherIntervalo();
  var info=INTERVALOS[indiceIntervalo];

  document.getElementById("tipo-info").innerHTML=info.tipo;
  document.getElementById("titulo-info").innerHTML=info.titulo;
  document.getElementById("mensagem").innerHTML=info.mensagem;

  document.getElementById("bloco-relogio").style.display=info.mostrarRelogio?"block":"none";
  document.getElementById("bloco-clima").style.display=info.mostrarClima?"block":"none";

  var proximoIndice=indiceAtual+1;
  if(proximoIndice>=CAMPANHAS.length){proximoIndice=0;}

  document.getElementById("proximo").innerHTML="Próximo: "+CAMPANHAS[proximoIndice].titulo;

  /* Pré-carrega a próxima arte durante os 6 segundos da tela informativa. */
  preloader=new Image();
  preloader.src=CAMPANHAS[proximoIndice].imagem+"?v=22";

  animarBarra("barra-info",DURACAO_INFO);

  timerPrincipal=setTimeout(function(){
    mostrarAnuncio(proximoIndice);
  },DURACAO_INFO);
}

function escolherIntervalo(){
  if(INTERVALOS.length===1){
    ultimoIntervalo=0;
    return 0;
  }

  var novoIndice=ultimoIntervalo;

  while(novoIndice===ultimoIntervalo){
    novoIndice=Math.floor(Math.random()*INTERVALOS.length);
  }

  ultimoIntervalo=novoIndice;
  return novoIndice;
}

function animarBarra(id,duracao){
  var barra=document.getElementById(id);
  if(!barra){return;}

  barra.style.webkitTransitionDuration="0ms";
  barra.style.transitionDuration="0ms";
  barra.style.width="0%";

  barra.offsetWidth;

  barra.style.webkitTransitionDuration=duracao+"ms";
  barra.style.transitionDuration=duracao+"ms";
  barra.style.width="100%";
}

function iniciarRelogio(){
  function atualizar(){
    var agora=new Date();
    var horas=agora.getHours();
    var minutos=agora.getMinutes();

    horas=horas<10?"0"+horas:horas;
    minutos=minutos<10?"0"+minutos:minutos;

    document.getElementById("relogio").innerHTML=horas+":"+minutos;

    var dias=["dom","seg","ter","qua","qui","sex","sáb"];
    var meses=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

    document.getElementById("data").innerHTML=
      dias[agora.getDay()]+", "+agora.getDate()+" "+meses[agora.getMonth()];
  }

  atualizar();
  setInterval(atualizar,1000);
}

function buscarClima(){
  var lat="-23.6226";
  var lon="-45.4124";
  var url="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current_weather=true";

  var xhr=new XMLHttpRequest();
  xhr.open("GET",url,true);
  xhr.timeout=3500;

  xhr.onreadystatechange=function(){
    if(xhr.readyState===4&&xhr.status===200){
      try{
        var dados=JSON.parse(xhr.responseText);
        var temp=Math.round(dados.current_weather.temperature);
        var codigo=dados.current_weather.weathercode;

        document.getElementById("clima").innerHTML=
          temp+"°C • "+descricaoClima(codigo);
      }catch(e){
        climaIndisponivel();
      }
    }
  };

  xhr.onerror=climaIndisponivel;
  xhr.ontimeout=climaIndisponivel;
  xhr.send();
}

function climaIndisponivel(){
  document.getElementById("clima").innerHTML="--°C • Clima indisponível";
}

function descricaoClima(codigo){
  if(codigo===0){return "Céu limpo";}
  if(codigo>=1&&codigo<=3){return "Parcialmente nublado";}
  if(codigo>=45&&codigo<=48){return "Névoa";}
  if(codigo>=51&&codigo<=57){return "Garoa";}
  if(codigo>=61&&codigo<=67){return "Chuva";}
  if(codigo>=80&&codigo<=82){return "Pancadas de chuva";}
  if(codigo>=95){return "Trovoada";}
  return "Tempo variável";
}
</script>
</body>
</html>

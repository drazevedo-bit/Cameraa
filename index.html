<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador de Pessoas</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f12;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
  .counter {
    font-size: 3.2rem;
    font-weight: 800;
    color: #0a84ff;
    margin: 8px 0 2px 0;
    line-height: 1;
  }
  .counter-label { font-size: 12px; color: #999; margin-bottom: 14px; }
  .video-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 3 / 4;
    background: #1a1a1e;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  video, canvas.overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  canvas.overlay { pointer-events: none; }
  .controls-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    width: 100%;
    max-width: 480px;
  }
  button.action {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    background: #26262b;
    color: #f2f2f2;
    cursor: pointer;
  }
  button.action.primary { background: #0a84ff; }
  button.action.danger { background: #ff3b30; }
  button.action:disabled { opacity: 0.4; }
  #status {
    margin-top: 12px;
    font-size: 13px;
    color: #999;
    text-align: center;
    min-height: 18px;
  }
  .privacy-note {
    margin-top: 14px;
    font-size: 11px;
    color: #666;
    text-align: center;
    max-width: 480px;
  }
</style>
</head>
<body>

<h1>Contador de pessoas no carro</h1>
<div class="counter" id="counter">0</div>
<div class="counter-label" id="dateLabel">carregando data...</div>

<div class="video-wrap" id="videoWrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay" class="overlay"></canvas>
</div>

<div class="controls-row">
  <button id="toggleBtn" class="action primary" disabled>Iniciar contagem</button>
  <button id="resetBtn" class="action danger">Zerar contagem</button>
</div>

<div id="status">Carregando modelos...</div>

<div class="privacy-note">Este app conta pessoas sem salvar fotos. Os dados ficam apenas neste aparelho e sao apagados automaticamente todo dia.</div>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const counterEl = document.getElementById('counter');
const dateLabel = document.getElementById('dateLabel');
const toggleBtn = document.getElementById('toggleBtn');
const resetBtn = document.getElementById('resetBtn');
const statusEl = document.getElementById('status');

const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model';
const MATCH_THRESHOLD = 0.6; // mais tolerante a variacoes de angulo/luz
const CANDIDATE_MATCH_THRESHOLD = 0.65; // tolerancia para agrupar o mesmo rosto entre frames
const CONFIRM_FRAMES = 4; // precisa aparecer nao-reconhecido por N deteccoes seguidas pra contar
const DETECT_INTERVAL_MS = 400; // intervalo entre analises (evita ruido de excesso de frames)
const CANDIDATE_TIMEOUT_MS = 2000; // descarta candidato se sumir da camera
const STORAGE_KEY = 'peopleCounterData';

let watching = false;
let knownDescriptors = [];
let pendingCandidates = []; // rostos ainda nao confirmados como "pessoa nova"
let wakeLock = null;
let currentStream = null;
let currentDeviceId = null;

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    const data = JSON.parse(raw);
    if (data.date === todayStr()) {
      knownDescriptors = data.descriptors.map(d => new Float32Array(d));
      counterEl.textContent = knownDescriptors.length;
      dateLabel.textContent = 'Contagem do dia ' + todayStr();
      return;
    }
  }
  knownDescriptors = [];
  counterEl.textContent = '0';
  saveData();
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    date: todayStr(),
    descriptors: knownDescriptors.map(d => Array.from(d))
  }));
  dateLabel.textContent = 'Contagem do dia ' + todayStr();
}

async function loadModels() {
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
  statusEl.textContent = 'Modelos carregados. Ativando camera...';
}

async function pickFrontCamera() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter(d => d.kind === 'videoinput');
  const front = cams.find(c => /front|user|frontal/i.test(c.label));
  if (front) {
    currentDeviceId = front.deviceId;
  } else if (cams.length > 0) {
    // se nao achar pelo nome, assume a primeira da lista como fallback
    currentDeviceId = cams[0].deviceId;
  }
}

async function startCamera() {
  try {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
    }

    // primeiro pede uma camera generica so pra liberar permissao e ver os nomes
    if (!currentDeviceId) {
      const temp = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'user' } } });
      temp.getTracks().forEach(t => t.stop());
      await pickFrontCamera();
    }

    const constraints = currentDeviceId
      ? { video: { deviceId: { exact: currentDeviceId } } }
      : { video: { facingMode: { ideal: 'user' } } };

    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = currentStream;
    await new Promise(res => video.onloadedmetadata = res);
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;

    statusEl.textContent = 'Camera ativa. Toque em Iniciar contagem.';
    toggleBtn.disabled = false;
  } catch (err) {
    statusEl.textContent = 'Erro ao acessar a camera: ' + err.message;
  }
}

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { }
}

toggleBtn.addEventListener('click', async () => {
  watching = !watching;
  toggleBtn.textContent = watching ? 'Pausar contagem' : 'Iniciar contagem';
  statusEl.textContent = watching ? 'Contando pessoas...' : 'Pausado.';
  if (watching) {
    await requestWakeLock();
    detectTick();
  }
});

resetBtn.addEventListener('click', () => {
  knownDescriptors = [];
  pendingCandidates = [];
  counterEl.textContent = '0';
  saveData();
  statusEl.textContent = 'Contagem zerada.';
});

function bestDistance(descriptor, list) {
  let min = Infinity;
  for (const item of list) {
    const d = faceapi.euclideanDistance(descriptor, item.descriptor || item);
    if (d < min) min = d;
  }
  return min;
}

async function detectTick() {
  if (!watching) return;

  const detections = await faceapi
    .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks()
    .withFaceDescriptors();

  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  const now = Date.now();
  const matchedCandidateIndexes = new Set();

  detections.forEach(d => {
    const box = d.detection.box;

    // 1. ja e uma pessoa confirmada?
    const knownDist = bestDistance(d.descriptor, knownDescriptors);
    if (knownDist < MATCH_THRESHOLD) {
      ctx.strokeStyle = '#34c759';
      ctx.lineWidth = 3;
      ctx.strokeRect(box.x, box.y, box.width, box.height);
      return;
    }

    // 2. bate com algum candidato ja em observacao?
    let matchIdx = -1;
    let matchDist = Infinity;
    pendingCandidates.forEach((cand, i) => {
      const dist = faceapi.euclideanDistance(d.descriptor, cand.descriptor);
      if (dist < CANDIDATE_MATCH_THRESHOLD && dist < matchDist) {
        matchDist = dist;
        matchIdx = i;
      }
    });

    if (matchIdx >= 0) {
      pendingCandidates[matchIdx].descriptor = d.descriptor; // atualiza com leitura mais recente
      pendingCandidates[matchIdx].frames += 1;
      pendingCandidates[matchIdx].lastSeen = now;
      matchedCandidateIndexes.add(matchIdx);

      if (pendingCandidates[matchIdx].frames >= CONFIRM_FRAMES) {
        knownDescriptors.push(pendingCandidates[matchIdx].descriptor);
        pendingCandidates.splice(matchIdx, 1);
        counterEl.textContent = knownDescriptors.length;
        saveData();
      }
    } else {
      pendingCandidates.push({ descriptor: d.descriptor, frames: 1, lastSeen: now });
    }

    ctx.strokeStyle = '#ff9500';
    ctx.lineWidth = 3;
    ctx.strokeRect(box.x, box.y, box.width, box.height);
  });

  // remove candidatos que sumiram da camera ha muito tempo
  pendingCandidates = pendingCandidates.filter(c => now - c.lastSeen < CANDIDATE_TIMEOUT_MS);

  setTimeout(detectTick, DETECT_INTERVAL_MS);
}

(async () => {
  await loadModels();
  await startCamera();
  loadData();
})();
</script>

</body>
</html>

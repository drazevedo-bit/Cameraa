<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera com Deteccao Facial</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f12;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 12px; }
  .video-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 3 / 4;
    background: #1a1a1e;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  video, canvas.overlay, img.preview {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  canvas.overlay { pointer-events: none; }
  .badge {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    display: none;
    z-index: 5;
  }
  .badge.known { background: #34c759; color: #003d13; }
  .badge.unknown { background: #ff3b30; color: #3d0000; }
  .controls-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    width: 100%;
    max-width: 480px;
    flex-wrap: wrap;
  }
  button.action {
    flex: 1;
    min-width: 140px;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    background: #26262b;
    color: #f2f2f2;
    cursor: pointer;
  }
  button.action.primary { background: #0a84ff; }
  button.action.danger { background: #ff3b30; }
  button.action:disabled { opacity: 0.4; }
  #status {
    margin-top: 12px;
    font-size: 13px;
    color: #999;
    text-align: center;
    min-height: 18px;
  }
  .shots {
    margin-top: 16px;
    width: 100%;
    max-width: 480px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .shots img {
    width: 72px;
    height: 96px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid #ff3b30;
  }
</style>
</head>
<body>

<h1>Camera com deteccao facial</h1>

<div class="video-wrap" id="videoWrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay" class="overlay"></canvas>
  <div id="badge" class="badge"></div>
</div>

<div class="controls-row">
  <button id="enrollBtn" class="action primary">Cadastrar meu rosto</button>
  <button id="toggleBtn" class="action" disabled>Ativar vigilancia</button>
  <button id="resetBtn" class="action danger">Apagar cadastro</button>
</div>

<div id="status">Carregando modelos de reconhecimento facial...</div>

<div class="shots" id="shots"></div>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const badge = document.getElementById('badge');
const enrollBtn = document.getElementById('enrollBtn');
const toggleBtn = document.getElementById('toggleBtn');
const resetBtn = document.getElementById('resetBtn');
const statusEl = document.getElementById('status');
const shotsEl = document.getElementById('shots');

const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model';
const MATCH_THRESHOLD = 0.5; // menor = mais rigoroso
const CAPTURE_COOLDOWN_MS = 5000;

let myDescriptor = null;
let watching = false;
let lastCaptureTime = 0;
let stream = null;

async function loadModels() {
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
  statusEl.textContent = 'Modelos carregados. Ativando camera...';
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    video.srcObject = stream;
    await new Promise(res => video.onloadedmetadata = res);
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
    statusEl.textContent = 'Camera ativa. Cadastre seu rosto para comecar.';
    enrollBtn.disabled = false;
  } catch (err) {
    statusEl.textContent = 'Erro ao acessar a camera: ' + err.message;
  }
}

function loadSavedDescriptor() {
  const saved = localStorage.getItem('myFaceDescriptor');
  if (saved) {
    myDescriptor = new Float32Array(JSON.parse(saved));
    toggleBtn.disabled = false;
    statusEl.textContent = 'Rosto cadastrado encontrado. Pronto para vigiar.';
  }
}

enrollBtn.addEventListener('click', async () => {
  statusEl.textContent = 'Detectando seu rosto, olhe para a camera...';
  const detection = await faceapi
    .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks()
    .withFaceDescriptor();

  if (!detection) {
    statusEl.textContent = 'Nenhum rosto detectado. Tente novamente com boa luz.';
    return;
  }
  myDescriptor = detection.descriptor;
  localStorage.setItem('myFaceDescriptor', JSON.stringify(Array.from(myDescriptor)));
  toggleBtn.disabled = false;
  statusEl.textContent = 'Rosto cadastrado com sucesso!';
});

resetBtn.addEventListener('click', () => {
  localStorage.removeItem('myFaceDescriptor');
  myDescriptor = null;
  toggleBtn.disabled = true;
  watching = false;
  toggleBtn.textContent = 'Ativar vigilancia';
  statusEl.textContent = 'Cadastro apagado.';
});

toggleBtn.addEventListener('click', () => {
  watching = !watching;
  toggleBtn.textContent = watching ? 'Parar vigilancia' : 'Ativar vigilancia';
  statusEl.textContent = watching ? 'Vigiando...' : 'Vigilancia pausada.';
  if (watching) detectLoop();
});

function takeAutoPhoto() {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.9);

  const img = document.createElement('img');
  img.src = dataUrl;
  shotsEl.prepend(img);

  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'rosto-desconhecido-' + Date.now() + '.jpg';
  a.click();
}

async function detectLoop() {
  if (!watching) return;

  const detections = await faceapi
    .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks()
    .withFaceDescriptors();

  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  let sawUnknown = false;
  let sawKnown = false;

  detections.forEach(d => {
    const distance = faceapi.euclideanDistance(d.descriptor, myDescriptor);
    const isMe = distance < MATCH_THRESHOLD;
    if (isMe) sawKnown = true; else sawUnknown = true;

    const box = d.detection.box;
    ctx.strokeStyle = isMe ? '#34c759' : '#ff3b30';
    ctx.lineWidth = 3;
    ctx.strokeRect(box.x, box.y, box.width, box.height);
  });

  if (sawUnknown) {
    badge.textContent = 'Rosto desconhecido!';
    badge.className = 'badge unknown';
    badge.style.display = 'block';
    const now = Date.now();
    if (now - lastCaptureTime > CAPTURE_COOLDOWN_MS) {
      takeAutoPhoto();
      lastCaptureTime = now;
    }
  } else if (sawKnown) {
    badge.textContent = 'Voce';
    badge.className = 'badge known';
    badge.style.display = 'block';
  } else {
    badge.style.display = 'none';
  }

  requestAnimationFrame(detectLoop);
}

(async () => {
  await loadModels();
  await startCamera();
  loadSavedDescriptor();
})();
</script>

</body>
</html>

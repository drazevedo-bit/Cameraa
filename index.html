<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Mídia de Bordo - V2.6 Conforto Visual</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
#app{position:relative;width:100%;height:100%;background:#000}
#tela-anuncio{position:absolute;inset:0;background:#000;display:block;z-index:10}
#imagem-anuncio,#video-anuncio{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}
#fallback-anuncio{position:absolute;inset:0;display:none;background:#08111f;text-align:center;padding:90px 24px 24px}
#fallback-anuncio h1{font-size:34px;margin-bottom:16px}
#fallback-anuncio p{font-size:18px;color:#b6c4d4}
.barra-container{position:absolute;left:0;bottom:0;width:100%;height:5px;background:rgba(255,255,255,.15);z-index:30}
#barra-anuncio,#barra-info{width:0;height:100%;background:#37d39a;transition-property:width;transition-timing-function:linear;-webkit-transition-property:width;-webkit-transition-timing-function:linear}

#tela-info{position:absolute;inset:0;display:none;z-index:20;background:#08111f;overflow:hidden}
#fundo-info{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.01);-webkit-transform:scale(1.01);transition:transform 6s linear;-webkit-transition:-webkit-transform 6s linear}
#overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(4,12,22,.40) 0%,rgba(4,12,22,.34) 22%,rgba(4,12,22,.58) 68%,rgba(4,12,22,.88) 100%)}

.info-topo{position:absolute;top:0;left:0;width:100%;height:14%;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(5,16,28,.78);border-bottom:1px solid rgba(255,255,255,.12)}
#relogio{font-size:44px;font-weight:bold;line-height:1}
#data{font-size:15px;color:#d6e0e9;margin-top:4px;text-transform:capitalize}
#clima-wrap{text-align:right}
#cidade{font-size:17px;font-weight:bold}
#clima{font-size:16px;color:#d6e0e9;margin-top:3px}

.conteudo{position:absolute;left:0;top:14%;width:100%;height:72%;display:flex;align-items:flex-end;padding:0 28px 42px}
.caixa-texto{max-width:88%;text-shadow:0 2px 8px rgba(0,0,0,.65)}
#selo{display:inline-block;padding:8px 14px;border-radius:20px;background:rgba(0,138,103,.90);font-size:13px;font-weight:bold;letter-spacing:1px;margin-bottom:15px}
#titulo-info{font-size:38px;line-height:1.08;font-weight:bold;margin-bottom:14px}
#mensagem{font-size:21px;line-height:1.43;color:#f2f6f9}
#linha-acento{width:54px;height:4px;border-radius:5px;background:#59e0b5;margin-top:18px}

#rodape-info{position:absolute;left:0;bottom:0;width:100%;height:14%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,14,25,.92);border-top:1px solid rgba(255,255,255,.12);text-align:center;padding:8px 14px}
#rodape-info strong{font-size:14px;letter-spacing:1.2px}
#rodape-info span{font-size:12px;color:#aebdcc;letter-spacing:1.8px;margin-top:4px}
#barra-info{position:absolute;left:0;bottom:0;height:5px;z-index:40}

@media (orientation:landscape){
  #relogio{font-size:36px}
  #titulo-info{font-size:31px}
  #mensagem{font-size:18px}
  .conteudo{padding:0 34px 28px}
}
</style>

var indiceAtual=0;
var ultimoIntervalo=-1;
var timerPrincipal=null;
var preloader=null;

window.onload=function(){
  iniciarRelogio();
  buscarClima();
  mostrarAnuncio(indiceAtual);
  setInterval(function(){buscarClima();},1200000);
};

function mostrarAnuncio(indice){
  if(timerPrincipal){clearTimeout(timerPrincipal);}
  if(indice>=CAMPANHAS.length){indice=0;}
  indiceAtual=indice;

  var telaAnuncio=document.getElementById("tela-anuncio");
  var telaInfo=document.getElementById("tela-info");
  var img=document.getElementById("imagem-anuncio");
  var video=document.getElementById("video-anuncio");
  var fallback=document.getElementById("fallback-anuncio");
  var campanha=CAMPANHAS[indiceAtual];

  img.style.display="none";
  video.style.display="none";
  fallback.style.display="none";
  try{video.pause();}catch(e){}
  video.removeAttribute("src");
  try{video.load();}catch(e){}

  telaInfo.style.display="none";
  telaAnuncio.style.display="block";

  document.getElementById("fallback-titulo").innerHTML=campanha.titulo;
  document.getElementById("fallback-texto").innerHTML="Arquivo esperado: "+campanha.arquivo;

  if(campanha.tipo==="video"){mostrarVideo(campanha);}
  else{mostrarImagem(campanha);}
}

function mostrarImagem(campanha){
  var img=document.getElementById("imagem-anuncio");
  var fallback=document.getElementById("fallback-anuncio");

  img.onerror=function(){
    img.style.display="none";
    fallback.style.display="block";
    animarBarra("barra-anuncio",DURACAO_ANUNCIO);
    timerPrincipal=setTimeout(function(){mostrarInfo();},DURACAO_ANUNCIO);
  };

  img.onload=function(){
    fallback.style.display="none";
    img.style.display="block";
    animarBarra("barra-anuncio",DURACAO_ANUNCIO);
    timerPrincipal=setTimeout(function(){mostrarInfo();},DURACAO_ANUNCIO);
  };

  img.src=campanha.arquivo+"?v=26";
}

function mostrarVideo(campanha){
  var video=document.getElementById("video-anuncio");
  var fallback=document.getElementById("fallback-anuncio");
  var terminou=false;
  var iniciou=false;

  function finalizar(){
    if(terminou){return;}
    terminou=true;
    if(timerPrincipal){clearTimeout(timerPrincipal);}
    try{video.pause();}catch(e){}
    video.style.display="none";
    mostrarInfo();
  }

  function falha(){
    if(iniciou){return;}
    video.style.display="none";
    fallback.style.display="block";
    animarBarra("barra-anuncio",DURACAO_ANUNCIO);
    timerPrincipal=setTimeout(function(){mostrarInfo();},DURACAO_ANUNCIO);
  }

  video.onerror=falha;

  video.onloadedmetadata=function(){
    var duracao=video.duration;
    if(!duracao||!isFinite(duracao)||duracao<=0){duracao=DURACAO_ANUNCIO/1000;}
    video.muted=true;
    video.volume=0;
    video.style.display="block";
    fallback.style.display="none";
    animarBarra("barra-anuncio",Math.round(duracao*1000));
  };

  video.onplaying=function(){
    if(iniciou){return;}
    iniciou=true;
    var duracao=video.duration;
    if(!duracao||!isFinite(duracao)||duracao<=0){duracao=DURACAO_ANUNCIO/1000;}
    timerPrincipal=setTimeout(function(){finalizar();},Math.round(duracao*1000)+2000);
  };

  video.onended=function(){finalizar();};
  video.src=campanha.arquivo+"?v=26";
  video.autoplay=true;
  video.muted=true;
  video.volume=0;
  try{video.load();video.play();}catch(e){}

  setTimeout(function(){if(!iniciou&&video.style.display==="none"){falha();}},5000);
}

function mostrarInfo(){
  if(timerPrincipal){clearTimeout(timerPrincipal);}

  var telaAnuncio=document.getElementById("tela-anuncio");
  var telaInfo=document.getElementById("tela-info");
  var img=document.getElementById("imagem-anuncio");
  var video=document.getElementById("video-anuncio");

  img.style.display="none";
  video.style.display="none";
  try{video.pause();}catch(e){}

  telaAnuncio.style.display="none";
  telaInfo.style.display="block";

  var i=escolherIntervalo();
  var info=INTERVALOS[i];
  var fundo=document.getElementById("fundo-info");

  document.getElementById("titulo-info").innerHTML=info.title;
  document.getElementById("mensagem").innerHTML=info.text;
  fundo.style.backgroundImage='url("'+FUNDOS[i%FUNDOS.length]+'")';

  fundo.style.webkitTransitionDuration="0ms";
  fundo.style.transitionDuration="0ms";
  fundo.style.webkitTransform="scale(1.01)";
  fundo.style.transform="scale(1.01)";
  fundo.offsetWidth;
  fundo.style.webkitTransitionDuration=DURACAO_INFO+"ms";
  fundo.style.transitionDuration=DURACAO_INFO+"ms";
  fundo.style.webkitTransform="scale(1.045)";
  fundo.style.transform="scale(1.045)";

  var proximo=indiceAtual+1;
  if(proximo>=CAMPANHAS.length){proximo=0;}

  if(CAMPANHAS[proximo].tipo==="video"){
    preloader=document.createElement("video");
    preloader.preload="auto";
    preloader.muted=true;
    preloader.src=CAMPANHAS[proximo].arquivo+"?v=26";
    try{preloader.load();}catch(e){}
  }else{
    preloader=new Image();
    preloader.src=CAMPANHAS[proximo].arquivo+"?v=26";
  }

  animarBarra("barra-info",DURACAO_INFO);
  timerPrincipal=setTimeout(function(){mostrarAnuncio(proximo);},DURACAO_INFO);
}

function escolherIntervalo(){
  if(INTERVALOS.length===1){ultimoIntervalo=0;return 0;}
  var novo=ultimoIntervalo;
  while(novo===ultimoIntervalo){novo=Math.floor(Math.random()*INTERVALOS.length);}
  ultimoIntervalo=novo;
  return novo;
}

function animarBarra(id,duracao){
  var barra=document.getElementById(id);
  if(!barra){return;}
  barra.style.webkitTransitionDuration="0ms";
  barra.style.transitionDuration="0ms";
  barra.style.width="0%";
  barra.offsetWidth;
  barra.style.webkitTransitionDuration=duracao+"ms";
  barra.style.transitionDuration=duracao+"ms";
  barra.style.width="100%";
}

function iniciarRelogio(){
  function atualizar(){
    var agora=new Date();
    var h=agora.getHours(),m=agora.getMinutes();
    h=h<10?"0"+h:h;
    m=m<10?"0"+m:m;
    document.getElementById("relogio").innerHTML=h+":"+m;

    var dias=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
    var meses=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    document.getElementById("data").innerHTML=dias[agora.getDay()]+", "+agora.getDate()+" "+meses[agora.getMonth()];
  }
  atualizar();
  setInterval(atualizar,1000);
}

function buscarClima(){
  var lat="-23.6226",lon="-45.4124";
  var url="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current_weather=true";
  var xhr=new XMLHttpRequest();
  xhr.open("GET",url,true);
  xhr.timeout=3500;

  xhr.onreadystatechange=function(){
    if(xhr.readyState===4&&xhr.status===200){
      try{
        var d=JSON.parse(xhr.responseText);
        var temp=Math.round(d.current_weather.temperature);
        document.getElementById("clima").innerHTML=temp+"°C • "+descricaoClima(d.current_weather.weathercode);
      }catch(e){climaIndisponivel();}
    }
  };
  xhr.onerror=climaIndisponivel;
  xhr.ontimeout=climaIndisponivel;
  xhr.send();
}

function climaIndisponivel(){document.getElementById("clima").innerHTML="--°C • Clima indisponível";}

function descricaoClima(c){
  if(c===0){return "Céu limpo";}
  if(c>=1&&c<=3){return "Parcialmente nublado";}
  if(c>=45&&c<=48){return "Névoa";}
  if(c>=51&&c<=57){return "Garoa";}
  if(c>=61&&c<=67){return "Chuva";}
  if(c>=80&&c<=82){return "Pancadas";}
  if(c>=95){return "Trovoada";}
  return "Tempo variável";
}

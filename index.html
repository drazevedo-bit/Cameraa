<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador de Pessoas</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f12;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
  .counter {
    font-size: 3.2rem;
    font-weight: 800;
    color: #0a84ff;
    margin: 8px 0 2px 0;
    line-height: 1;
  }
  .counter-label { font-size: 12px; color: #999; margin-bottom: 14px; }
  .video-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 3 / 4;
    background: #1a1a1e;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  video, canvas.overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  canvas.overlay { pointer-events: none; }
  .controls-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    width: 100%;
    max-width: 480px;
  }
  button.action {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    background: #26262b;
    color: #f2f2f2;
    cursor: pointer;
  }
  button.action.primary { background: #0a84ff; }
  button.action.danger { background: #ff3b30; }
  button.action:disabled { opacity: 0.4; }
  #status {
    margin-top: 12px;
    font-size: 13px;
    color: #999;
    text-align: center;
    min-height: 18px;
  }
  .gallery {
    margin-top: 16px;
    width: 100%;
    max-width: 480px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .gallery-item { text-align: center; }
  .gallery-item img {
    width: 70px;
    height: 92px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid #0a84ff;
  }
  .gallery-item span {
    display: block;
    font-size: 10px;
    color: #777;
    margin-top: 2px;
  }
</style>
</head>
<body>

<h1>Contador de pessoas no carro</h1>
<div class="counter" id="counter">0</div>
<div class="counter-label" id="dateLabel">carregando data...</div>

<div class="video-wrap" id="videoWrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay" class="overlay"></canvas>
</div>

<div class="controls-row">
  <button id="toggleBtn" class="action primary" disabled>Iniciar contagem</button>
  <button id="resetBtn" class="action danger">Zerar contagem</button>
</div>

<div id="status">Carregando modelos...</div>

<div class="gallery" id="gallery"></div>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const counterEl = document.getElementById('counter');
const dateLabel = document.getElementById('dateLabel');
const toggleBtn = document.getElementById('toggleBtn');
const resetBtn = document.getElementById('resetBtn');
const statusEl = document.getElementById('status');
const galleryEl = document.getElementById('gallery');

const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model';
const MATCH_THRESHOLD = 0.5;
const STORAGE_KEY = 'peopleCounterData';

let watching = false;
let knownDescriptors = [];
let wakeLock = null;
let currentStream = null;
let currentDeviceId = null;

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    const data = JSON.parse(raw);
    if (data.date === todayStr()) {
      knownDescriptors = data.descriptors.map(d => new Float32Array(d));
      counterEl.textContent = knownDescriptors.length;
      dateLabel.textContent = 'Contagem do dia ' + todayStr();
      return;
    }
  }
  knownDescriptors = [];
  counterEl.textContent = '0';
  saveData();
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    date: todayStr(),
    descriptors: knownDescriptors.map(d => Array.from(d))
  }));
  dateLabel.textContent = 'Contagem do dia ' + todayStr();
}

async function loadModels() {
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
  statusEl.textContent = 'Modelos carregados. Ativando camera...';
}

async function pickFrontCamera() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter(d => d.kind === 'videoinput');
  const front = cams.find(c => /front|user|frontal/i.test(c.label));
  if (front) {
    currentDeviceId = front.deviceId;
  } else if (cams.length > 0) {
    // se nao achar pelo nome, assume a primeira da lista como fallback
    currentDeviceId = cams[0].deviceId;
  }
}

async function startCamera() {
  try {
    if (currentStream) {
      currentStream.getTracks().forEach(t => t.stop());
    }

    // primeiro pede uma camera generica so pra liberar permissao e ver os nomes
    if (!currentDeviceId) {
      const temp = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'user' } } });
      temp.getTracks().forEach(t => t.stop());
      await pickFrontCamera();
    }

    const constraints = currentDeviceId
      ? { video: { deviceId: { exact: currentDeviceId } } }
      : { video: { facingMode: { ideal: 'user' } } };

    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = currentStream;
    await new Promise(res => video.onloadedmetadata = res);
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;

    statusEl.textContent = 'Camera ativa. Toque em Iniciar contagem.';
    toggleBtn.disabled = false;
  } catch (err) {
    statusEl.textContent = 'Erro ao acessar a camera: ' + err.message;
  }
}

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { }
}

function addPersonPhoto(dataUrl, count) {
  const item = document.createElement('div');
  item.className = 'gallery-item';
  const img = document.createElement('img');
  img.src = dataUrl;
  const label = document.createElement('span');
  const now = new Date();
  label.textContent = '#' + count + ' - ' + now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  item.appendChild(img);
  item.appendChild(label);
  galleryEl.prepend(item);
}

function snapshot() {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  return canvas.toDataURL('image/jpeg', 0.85);
}

toggleBtn.addEventListener('click', async () => {
  watching = !watching;
  toggleBtn.textContent = watching ? 'Pausar contagem' : 'Iniciar contagem';
  statusEl.textContent = watching ? 'Contando pessoas...' : 'Pausado.';
  if (watching) {
    await requestWakeLock();
    detectLoop();
  }
});

resetBtn.addEventListener('click', () => {
  knownDescriptors = [];
  counterEl.textContent = '0';
  galleryEl.innerHTML = '';
  saveData();
  statusEl.textContent = 'Contagem zerada.';
});

async function detectLoop() {
  if (!watching) return;

  const detections = await faceapi
    .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks()
    .withFaceDescriptors();

  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  detections.forEach(d => {
    let isNew = true;
    for (const known of knownDescriptors) {
      const distance = faceapi.euclideanDistance(d.descriptor, known);
      if (distance < MATCH_THRESHOLD) { isNew = false; break; }
    }

    const box = d.detection.box;
    ctx.strokeStyle = isNew ? '#ff9500' : '#34c759';
    ctx.lineWidth = 3;
    ctx.strokeRect(box.x, box.y, box.width, box.height);

    if (isNew) {
      knownDescriptors.push(d.descriptor);
      counterEl.textContent = knownDescriptors.length;
      saveData();
      addPersonPhoto(snapshot(), knownDescriptors.length);
    }
  });

  requestAnimationFrame(detectLoop);
}

(async () => {
  await loadModels();
  await startCamera();
  loadData();
})();
</script>

</body>
</html>
